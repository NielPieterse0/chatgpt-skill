name: Skill adoption candidate
description: Propose a skill for assessment, adaptation, or rejection.
title: "skill: "
labels:
  - skill-candidate
body:
  - type: markdown
    attributes:
      value: |
        Read the research synthesis, package standard, security standard, evaluation standard, and implementation backlog before proposing runtime adoption.
  - type: input
    id: source
    attributes:
      label: Source location
      description: Provide the canonical repository URL and exact immutable revision.
      placeholder: https://github.com/owner/repository at <commit>
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Customer outcome
      description: Describe the concrete recurring task or result this skill should improve.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline and observed gap
      description: Describe how ChatGPT performs the task without the skill, including real failures, inconsistency, cost, or risk.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Project-specific evidence
      description: Provide real tasks, runbooks, incidents, corrections, execution traces, or other evidence that should shape the skill.
    validations:
      required: true
  - type: textarea
    id: trigger_boundary
    attributes:
      label: Trigger boundary
      description: List realistic should-trigger cases, adjacent near-misses, conflicts, and prompt-injection concerns.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Proposed capability tier
      description: Choose the lowest credible tier. Tier 3 and Tier 4 remain prohibited.
      options:
        - Tier 0 - instructions only
        - Tier 1 - repository read-only
        - Tier 2 - approved writes under .work/<skill-name>/ only
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities, scopes, and enforcement
      description: Identify filesystem, script, tool, dependency, network, credential, mutation, and adapter requirements plus the enforcement point for each.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation and stop criteria
      description: Define baseline comparisons, critical assertions, abuse cases, human review, cost signals, and when to defer or reject the candidate.
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: License, provenance, and rollback
      description: State the source license, immutable provenance, unresolved concerns, maintenance owner, disablement, and rollback method.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Initial runtime target
      options:
        - ChatGPT
        - Portable core only
        - Future Codex adapter
    validations:
      required: true
